name: Workflow Security

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout for read-only policy checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test dependency policy
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Verify Dependabot commit provenance
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/dependency_policy.py

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: devops-actions/actionlint@ec02b36684b2f574f1d219ad0a43b082e46bf3e4 # v0.1.13

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          min-severity: medium

  winget-validation:
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout for read-only WinGet checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test WinGet publication with isolated API stubs
        run: python -m unittest discover -s .github/scripts -p 'test_winget*.py' -v
      - name: Install the pinned WinGet validator
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/install_winget.ps1
      - name: Validate manifests for the real latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/winget_release.py --validate-only

  workflow-security-gate:
    if: always()
    needs: [actionlint, zizmor, dependency-policy, winget-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all security checks to succeed
        env:
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
          POLICY_RESULT: ${{ needs.dependency-policy.result }}
          WINGET_RESULT: ${{ needs.winget-validation.result }}
        run: |
          test "$ACTIONLINT_RESULT" = success
          test "$ZIZMOR_RESULT" = success
          test "$POLICY_RESULT" = success
          test "$WINGET_RESULT" = success
