name: Publish WinGet manifest

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: winget-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  submit:
    if: github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Validate release and submit WinGet update
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          EVENT_PATH: ${{ github.event_path }}
        run: python3 .github/scripts/winget_release.py
