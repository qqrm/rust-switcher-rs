name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: nightly
          components: rustfmt
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cargo fmt
        run: cargo +nightly fmt --all -- --check
      - name: Verify locked dependency graph
        shell: bash
        run: |
          if ! cargo +nightly metadata --locked --format-version 1 > /dev/null; then
            cargo +nightly update --workspace
            git diff -- Cargo.lock
            echo 'Commit the reviewed lockfile update before merging.' >&2
            exit 1
          fi

  clippy-lib-tests:
    name: clippy-lib-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: nightly
          components: clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cargo clippy (core lib/tests only)
        run: cargo +nightly clippy --lib --tests -- -D warnings

  test-lib-tests:
    name: test-lib-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: nightly
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest
          fallback: none
      - name: Cargo test (core lib/tests only)
        run: cargo +nightly nextest run --lib --tests --locked

  windows-full:
    name: windows-full
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cargo fmt --check
        run: cargo +nightly fmt --check
      - name: Cargo clippy
        run: cargo +nightly clippy --all-targets --all-features -- -D warnings
      - name: Cargo build (debug-tracing)
        run: cargo +nightly build --features debug-tracing
      - name: Install cargo-nextest
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest
          fallback: none
      - name: Cargo nextest --locked
        run: cargo +nightly nextest run --locked
      - name: Build desktop test and release applications
        shell: pwsh
        run: |
          cargo +nightly build --locked --bin rust-switcher-debug --features debug-tracing,debug-binary
          if ($LASTEXITCODE -ne 0) { throw 'Debug build failed' }
          cargo +nightly build --release --locked --bin rust-switcher
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
      - name: Exercise actual applications in the isolated desktop
        timeout-minutes: 5
        shell: pwsh
        env:
          RUST_SWITCHER_HOSTED_E2E: '1'
        run: ./scripts/e2e/run-hosted.ps1 -DebugExe ./target/debug/rust-switcher-debug.exe -ReleaseExe ./target/release/rust-switcher.exe

      - name: Verify real crate packaging and tokenless publisher preflight
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cargo +nightly package --workspace --locked
          if ($LASTEXITCODE -ne 0) { throw 'Verified workspace packaging failed' }
          $version = python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read package version' }
          python .github/scripts/release_stages.py bundle --source "$env:SOURCE_SHA" --commit "$env:SOURCE_SHA" --version "$version" --directory "$env:RUNNER_TEMP/ci-publication"
          if ($LASTEXITCODE -ne 0) { throw 'Publication bundle validation failed' }
          $manifestSha = (Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP/ci-publication/manifest.json").Hash.ToLowerInvariant()
          python .github/scripts/release_stages.py preflight --source "$env:SOURCE_SHA" --commit "$env:SOURCE_SHA" --version "$version" --directory "$env:RUNNER_TEMP/ci-publication" --manifest-sha "$manifestSha" --sterile "$env:RUNNER_TEMP/ci-publish-cargo"
          if ($LASTEXITCODE -ne 0) { throw 'Tokenless publication preflight failed' }

  dependency-security:
    name: dependency-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependency tooling
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: |
            cargo-audit@0.22.2
            cargo-deny@0.20.2
            cargo-machete@0.9.2
          fallback: none
      - name: Audit dependencies
        run: cargo audit
      - name: Check dependency advisories and sources
        run: cargo deny check advisories bans sources
      - name: Check unused dependencies
        run: cargo machete

  ci-gate:
    if: always()
    needs: [fmt, clippy-lib-tests, test-lib-tests, windows-full, dependency-security]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every build and test job to succeed
        env:
          RESULT_0: ${{ needs.fmt.result }}
          RESULT_1: ${{ needs.clippy-lib-tests.result }}
          RESULT_2: ${{ needs.test-lib-tests.result }}
          RESULT_3: ${{ needs.windows-full.result }}
          RESULT_4: ${{ needs.dependency-security.result }}
        run: |
          test "$RESULT_0" = success
          test "$RESULT_1" = success
          test "$RESULT_2" = success
          test "$RESULT_3" = success
          test "$RESULT_4" = success
