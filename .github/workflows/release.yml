name: Release

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact merged commit requested by the dependency controller
        required: false
        type: string
      version:
        description: Optional explicit release version (defaults to the next patch version)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-dev
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_release: ${{ steps.release_context.outputs.should_release }}
      version: ${{ steps.prepare.outputs.version }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Verify publication commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$EXPECTED_SHA" ]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          fi
      - name: Checkout exact source without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Detect release-worthy dependency merge
        id: release_context
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('should_release', 'true');
              core.setOutput('reason', 'manual');
              return;
            }

            const message = context.payload.head_commit?.message ?? '';
            const subject = message.split('\n', 1)[0] ?? '';
            const match = subject.match(/\(#(\d+)\)$/);
            if (!match) {
              core.setOutput('should_release', 'false');
              core.setOutput('reason', 'no-pr-number-in-subject');
              return;
            }

            const prNumber = Number(match[1]);
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (
              !pr.merged ||
              pr.base.ref !== 'dev' ||
              pr.user.login !== 'dependabot[bot]' ||
              pr.merge_commit_sha !== context.sha
            ) {
              core.setOutput('should_release', 'false');
              core.setOutput('reason', 'no-matching-pr');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });
            if (!files.some(({ filename }) => filename === 'Cargo.lock' ||
                filename === 'Cargo.toml' || filename.endsWith('/Cargo.toml'))) {
              core.setOutput('should_release', 'false');
              core.setOutput('reason', 'actions-only-batch');
              return;
            }

            core.setOutput('should_release', 'true');
            core.setOutput('reason', `dependabot-pr-${prNumber}`);

      - name: Prepare only validated version data
        if: steps.release_context.outputs.should_release == 'true'
        id: prepare
        env:
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 .github/scripts/release_stages.py prepare --source "$SOURCE_SHA" --version "$RELEASE_VERSION" --directory "$RUNNER_TEMP/version-plan"
      - name: Transfer version plan to the isolated writer
        if: steps.release_context.outputs.should_release == 'true'
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: version-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/version-plan
          if-no-files-found: error
          retention-days: 1

  version-pr:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      merged: ${{ steps.await.outputs.merged }}
      version: ${{ steps.writer.outputs.version }}
    steps:
      - name: Checkout exact source without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Download this run's version plan by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: ${{ runner.temp }}/version-plan
          merge-multiple: true
      - name: Create or reuse the protected version PR
        id: writer
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: python3 .github/scripts/release_stages.py version-pr --source "$SOURCE_SHA" --directory "$RUNNER_TEMP/version-plan"
      - name: Wait for native checks and the exact PR head to merge
        id: await
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_PR: ${{ steps.writer.outputs.pr }}
          VERSION_HEAD: ${{ steps.writer.outputs.head }}
          EXISTING_MERGE: ${{ steps.writer.outputs.merged }}
        run: python3 .github/scripts/release_stages.py await-version --pr "$VERSION_PR" --head "$VERSION_HEAD" --commit "$EXISTING_MERGE"

  build:
    needs: version-pr
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      manifest_sha: ${{ steps.bundle.outputs.manifest_sha }}
    steps:
      - name: Checkout checked version merge without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.version-pr.outputs.merged }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - name: Verify and package without publication credentials
        shell: pwsh
        run: |
          cargo +nightly fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed' }
          cargo +nightly clippy --workspace --all-targets --all-features --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
          cargo +nightly test --workspace --all-features --all-targets --locked
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          cargo +nightly build --release --locked --bin rust-switcher
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          cargo +nightly package --workspace --locked
          if ($LASTEXITCODE -ne 0) { throw 'Package verification failed' }
      - name: Bind publication files to the checked source
        id: bundle
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.sha }}
          MERGED_SHA: ${{ needs.version-pr.outputs.merged }}
          RELEASE_VERSION: ${{ needs.version-pr.outputs.version }}
        run: |
          python .github/scripts/release_stages.py bundle --source "$env:SOURCE_SHA" --commit "$env:MERGED_SHA" --version "$env:RELEASE_VERSION" --directory "$env:RUNNER_TEMP/publication"
          if ($LASTEXITCODE -ne 0) { throw 'Publication manifest failed' }
      - name: Transfer verified publication files
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [version-pr, build]
    runs-on: windows-2025
    timeout-minutes: 25
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      SOURCE_SHA: ${{ github.sha }}
      MERGED_SHA: ${{ needs.version-pr.outputs.merged }}
      RELEASE_VERSION: ${{ needs.version-pr.outputs.version }}
      MANIFEST_SHA: ${{ needs.build.outputs.manifest_sha }}
    steps:
      - name: Checkout checked version merge without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.version-pr.outputs.merged }}
      - name: Install matching Cargo without reusing build caches
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: nightly
      - name: Download this run's verified files by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/publication
          merge-multiple: true
      - name: Check package identity in a sterile Cargo environment before authentication
        shell: pwsh
        run: |
          python .github/scripts/release_stages.py preflight --source "$env:SOURCE_SHA" --commit "$env:MERGED_SHA" --version "$env:RELEASE_VERSION" --directory "$env:RUNNER_TEMP/publication" --manifest-sha "$env:MANIFEST_SHA" --sterile "$env:RUNNER_TEMP/publication-cargo"
          if ($LASTEXITCODE -ne 0) { throw 'Publication preflight failed' }
      - name: Publish immutable tag and verified GitHub assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/release_stages.py publish-github --source "$env:SOURCE_SHA" --commit "$env:MERGED_SHA" --version "$env:RELEASE_VERSION" --directory "$env:RUNNER_TEMP/publication" --manifest-sha "$env:MANIFEST_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub publication failed' }
      - name: Authenticate to crates.io with trusted publishing
        id: crates_auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish checked crates without compilation
        shell: pwsh
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          python .github/scripts/release_stages.py publish-crates --source "$env:SOURCE_SHA" --commit "$env:MERGED_SHA" --version "$env:RELEASE_VERSION" --directory "$env:RUNNER_TEMP/publication" --manifest-sha "$env:MANIFEST_SHA" --sterile "$env:RUNNER_TEMP/publication-cargo"
          if ($LASTEXITCODE -ne 0) { throw 'Crates publication failed' }
