[workspace]
members = ["crates/rust-switcher-core"]

[package]
name = "rust-switcher"
version = "1.0.22"
edition = "2024"

description = "Windows keyboard layout switcher and text conversion utility"
license = "MIT"
repository = "https://github.com/qqrm/rust-switcher"
homepage = "https://github.com/qqrm/rust-switcher"
readme = "README.md"
keywords = ["windows", "winapi", "keyboard", "hotkey", "tray"]
categories = ["gui", "os::windows-apis"]

[dependencies]
rust-switcher-core = { version = "1.0.22", path = "crates/rust-switcher-core" }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1.6"
tempfile = "3.27"
lingua = { version = "1.8", default-features = false, features = ["english", "russian"] }
# The ranker uses EN/RU locally and verifies on-demand language model packs.
fst = "0.4.7"
sha2 = "0.10"
lingua-english-language-model = "=1.3.0"
lingua-russian-language-model = "=1.3.0"
tracing = { version = "0.1", features = ["release_max_level_off"] }
tracing-subscriber = { version = "0.3", features = [
    "fmt",
    "env-filter",
], optional = true }

[features]
default = []
debug-tracing = ["tracing-subscriber"]
debug-binary = []

[[bin]]
name = "rust-switcher"
path = "src/main.rs"

[[bin]]
name = "rust-switcher-debug"
path = "src/main_debug.rs"
required-features = ["debug-binary"]


[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Networking_WinHttp",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
    "Win32_System_SystemInformation",
    "Win32_System_Ole",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Dwm",
] }


[build-dependencies]
embed-resource = "3.0"

[target.'cfg(windows)'.build-dependencies]
windows = { version = "0.62", features = ["Win32_System_SystemServices"] }

[profile.release]
opt-level = "z"
lto = true          # full LTO (обычно меньше бинарь, но медленнее)
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
incremental = false

