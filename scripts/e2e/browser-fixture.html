<!doctype html>
<meta charset="utf-8">
<title>Rust Switcher browser regression</title>
<style>
  body { margin: 24px; font: 20px system-ui; }
  input, textarea, [contenteditable], iframe, #shadow-host {
    display: block; box-sizing: border-box; width: 700px; height: 100px;
    margin: 12px 0; padding: 12px; font: 22px system-ui; border: 2px solid #555;
  }
  iframe, #shadow-host { height: 150px; }
</style>
<h1>Owned local browser fixture</h1>
<main id="editors"></main>
<script>
  'use strict';
  document.title += location.hash === '#second' ? ' B' : ' A';
  let fields = {};
  const events = [];

  function observe(doc) {
    for (const type of ['keydown', 'keyup', 'focusin', 'focusout']) {
      doc.addEventListener(type, event => {
        events.push({type, key: event.key ?? '', code: event.code ?? '',
          alt: event.altKey ?? false, ctrl: event.ctrlKey ?? false,
          target: event.target.id ?? '', focused: doc.hasFocus()});
        if (events.length > 24) events.shift();
      }, {capture: true, passive: true});
    }
  }
  observe(document);

  function read(element) {
    return element.isContentEditable ? element.textContent : element.value;
  }
  function write(element, value) {
    if (element.isContentEditable) element.textContent = value;
    else element.value = value;
  }
  function deepActive(doc = document) {
    let element = doc.activeElement;
    while (element?.shadowRoot?.activeElement) element = element.shadowRoot.activeElement;
    if (element?.tagName === 'IFRAME') return deepActive(element.contentDocument);
    return element;
  }
  function editor(doc, kind, id) {
    const element = doc.createElement(kind === 'editable' ? 'div' : kind);
    if (kind === 'editable') element.contentEditable = 'true';
    if (kind === 'input') element.type = 'text';
    element.id = id;
    element.spellcheck = false;
    element.setAttribute('autocapitalize', 'off');
    element.setAttribute('autocomplete', 'off');
    element.setAttribute('aria-label', id);
    return element;
  }

  window.fixture = {
    async reset(kind) {
      const root = document.getElementById('editors');
      root.replaceChildren();
      fields = {};
      events.length = 0;
      for (const id of ['a', 'b', 'guard']) {
        let host = root;
        let doc = document;
        let editorKind = kind;
        if (kind === 'shadow') {
          const shell = document.createElement('div');
          shell.id = 'shadow-host';
          root.append(shell);
          host = shell.attachShadow({mode: 'open'});
          const style = document.createElement('style');
          style.textContent = '[contenteditable] { min-height: 90px; font: 22px system-ui; outline: none; }';
          host.append(style);
          editorKind = 'editable';
        } else if (kind === 'iframe') {
          const frame = document.createElement('iframe');
          root.append(frame);
          doc = frame.contentDocument;
          doc.open();
          doc.write('<!doctype html><meta charset="utf-8"><style>body{margin:8px}textarea{box-sizing:border-box;width:100%;height:100px;font:22px system-ui}</style>');
          doc.close();
          observe(doc);
          host = doc.body;
          editorKind = 'textarea';
        }
        const element = editor(doc, editorKind, id);
        host.append(element);
        fields[id] = element;
        write(element, id === 'a' ? '' : `${id}-sentinel`);
      }
      return true;
    },
    set(id, value) { write(fields[id], value); return true; },
    focus(id) {
      const element = fields[id];
      element.focus();
      if (element.isContentEditable) {
        const range = element.ownerDocument.createRange();
        range.selectNodeContents(element);
        range.collapse(false);
        const selection = element.ownerDocument.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      } else element.setSelectionRange(element.value.length, element.value.length);
      return deepActive() === element && document.hasFocus();
    },
    focused(id) { return deepActive() === fields[id] && document.hasFocus(); },
    diagnostics() {
      const active = deepActive();
      return {documentFocused: document.hasFocus(), activeId: active?.id ?? '',
        activeTag: active?.tagName ?? '',
        field: Object.entries(fields).find(([, element]) => element === active)?.[0] ?? null,
        events: [...events]};
    },
    values() { return Object.fromEntries(Object.entries(fields).map(([id, element]) => [id, read(element)])); },
    point(id) {
      const element = fields[id];
      for (let view = element.ownerDocument.defaultView; view !== window; view = view.parent) {
        view.frameElement.scrollIntoView({block: 'center'});
      }
      element.scrollIntoView({block: 'center'});
      const rect = element.getBoundingClientRect();
      let left = rect.left;
      let top = rect.top;
      for (let view = element.ownerDocument.defaultView; view !== window; view = view.parent) {
        const frame = view.frameElement;
        const frameRect = frame.getBoundingClientRect();
        left += frameRect.left + frame.clientLeft;
        top += frameRect.top + frame.clientTop;
      }
      // Large inset targets tolerate the small non-client border included in
      // outerHeight - innerHeight. Iframe coordinates are relative to the page.
      return {
        x: Math.round((screenX + (outerWidth - innerWidth) / 2 + left + rect.width / 2) * devicePixelRatio),
        y: Math.round((screenY + outerHeight - innerHeight + top + rect.height / 2) * devicePixelRatio)
      };
    }
  };
</script>
